name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  qualidade:
    name: Build, test, clippy, fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar toolchain Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache de build
        uses: Swatinem/rust-cache@v2

      - name: Verificar formatação
        run: cargo fmt --all --check

      - name: Clippy com warnings negados
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Testes
        # Os testes do rate-limiter sobem um Redis em container via
        # testcontainers. O runner do GitHub tem Docker, então rodam aqui
        # como qualquer outro teste.
        run: cargo test --workspace --all-features

      - name: Build release
        run: cargo build --release --workspace

  cobertura:
    name: Cobertura (mínimo 70%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2

      - name: Medir cobertura
        run: cargo llvm-cov --workspace --summary-only | tee cobertura.txt

      - name: Verificar limiares de cobertura
        # Falha se a cobertura global cair abaixo de 85% ou se o
        # redis_backend.rs ficar abaixo de 70% — que é onde o rate limiter
        # realmente executa.
        run: |
          # Campo 10 é "Lines / Cover" no resumo do llvm-cov.
          # Colunas: 1 nome · 2 regions · 3 missed · 4 cover% · 5 funcs ·
          #          6 missed · 7 cover% · 8 lines · 9 missed · 10 cover%
          GLOBAL=$(grep TOTAL cobertura.txt | awk '{print $10}')
          REDIS=$(grep 'redis_backend.rs' cobertura.txt | awk '{print $10}')
          echo "cobertura global:    $GLOBAL"
          echo "cobertura redis:      $REDIS"
          GLOBAL_SEM=$(echo "$GLOBAL" | tr -d '%')
          REDIS_SEM=$(echo "$REDIS" | tr -d '%')
          awk -v v="$GLOBAL_SEM" 'BEGIN { exit (v < 85.0) }' || {
            echo "cobertura global $GLOBAL abaixo do mínimo de 85%"; exit 1; }
          awk -v v="$REDIS_SEM" 'BEGIN { exit (v < 70.0) }' || {
            echo "cobertura redis_backend.rs $REDIS abaixo do mínimo de 70%"; exit 1; }

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: cobertura.txt

  docker:
    name: Build da imagem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem do gateway
        run: docker build --target runtime -t sushi-tech-gateway:ci .

      - name: Verificar que o binário responde e serve a demonstração
        run: |
          docker run -d --name gateway-test -p 8080:8080 sushi-tech-gateway:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/health > /dev/null; then
              echo "health OK após ${i}s"
              break
            fi
            sleep 1
          done

          # A configuração embutida na imagem aponta o upstream para o próprio
          # gateway, sob `/mock`. Este passo é o que prova que a demonstração é
          # autocontida: um contêiner sozinho, sem serviço externo, e ainda
          # assim com dashboard, destino e cache funcionando.
          curl -fsS http://127.0.0.1:8080/health
          echo
          curl -fsS http://127.0.0.1:8080/ | grep -q "Sushi Tech Gateway" \
            || { echo "dashboard não servido na raiz"; docker logs gateway-test; exit 1; }
          curl -fsS http://127.0.0.1:8080/mock/health
          echo

          primeira=$(curl -s -D - -o /dev/null "http://127.0.0.1:8080/api/cardapio?ci=1" | grep -i '^x-cache' | tr -d '\r')
          segunda=$(curl -s -D - -o /dev/null "http://127.0.0.1:8080/api/cardapio?ci=1" | grep -i '^x-cache' | tr -d '\r')
          echo "1ª leitura: $primeira"
          echo "2ª leitura: $segunda"
          echo "$segunda" | grep -qi "HIT" \
            || { echo "o cache não entrou em HIT na segunda leitura"; docker logs gateway-test; exit 1; }

  compose:
    name: docker compose end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Subir o ambiente completo
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/ready > /dev/null; then
              echo "pronto após ${i}s"
              break
            fi
            sleep 2
          done

      - name: Verificar dashboard e cache
        run: |
          curl -fsS http://127.0.0.1:8080/health
          echo
          curl -fsS http://127.0.0.1:8080/ | grep -q "Sushi Tech Gateway" \
            || { echo "dashboard não servido"; docker compose logs; exit 1; }

          # Cache: a primeira leitura vai ao destino, a segunda vem da memória.
          # Feito antes da rajada para que o orçamento ainda esteja livre.
          primeira=$(curl -s -D - -o /dev/null "http://127.0.0.1:8080/api/cardapio?ci=cache" | grep -i '^x-cache' | tr -d '\r')
          segunda=$(curl -s -D - -o /dev/null "http://127.0.0.1:8080/api/cardapio?ci=cache" | grep -i '^x-cache' | tr -d '\r')
          echo "1ª leitura: $primeira"
          echo "2ª leitura: $segunda"
          echo "$primeira" | grep -qi "MISS" || { echo "esperava MISS na 1ª leitura"; docker compose logs; exit 1; }
          echo "$segunda"  | grep -qi "HIT"  || { echo "esperava HIT na 2ª leitura"; docker compose logs; exit 1; }

      - name: Verificar headers de rate limit
        run: |
          curl -sI "http://127.0.0.1:8080/api/cardapio?ci=headers" \
            | grep -iE "^(ratelimit|x-cache)" \
            || { echo "headers de orçamento ausentes"; docker compose logs; exit 1; }

      - name: Verificar que a rajada é barrada
        run: |
          # `/api/cardapio` tem limite 8/60s na configuração de demonstração.
          # As leituras acima já consumiram parte do orçamento, então o que se
          # verifica é o efeito — houve barreira e houve tráfego — e não um
          # número exato, que dependeria do que veio antes.
          passaram=0
          barradas=0
          for i in $(seq 1 10); do
            codigo=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8080/api/cardapio?ci=ataque=$i")
            echo "requisição $i -> $codigo"
            if [ "$codigo" = "200" ]; then passaram=$((passaram + 1)); fi
            if [ "$codigo" = "429" ]; then barradas=$((barradas + 1)); fi
          done
          echo "passaram=$passaram barradas=$barradas"
          [ "$barradas" -gt 0 ] || { echo "nenhuma requisição foi barrada"; docker compose logs; exit 1; }
          [ "$passaram" -gt 0 ] || { echo "nenhuma requisição passou"; docker compose logs; exit 1; }

      - name: Encerrar ambiente
        if: always()
        run: docker compose down -v
