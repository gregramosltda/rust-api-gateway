[workspace]
resolver = "3"
members = [
    "crates/common",
    "crates/rate-limiter",
    "crates/cache",
    "crates/gateway",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/fireblasttech/rust-api-gateway"
authors = ["Fire Blast Tech"]

[workspace.dependencies]
# Internos
gateway-common = { path = "crates/common" }
gateway-rate-limiter = { path = "crates/rate-limiter" }
gateway-cache = { path = "crates/cache" }

# Runtime HTTP
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "time",
    "sync",
] }
tower = { version = "0.5", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.7", features = ["trace", "timeout", "cors"] }
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = [
    "client",
    "client-legacy",
    "http1",
    "server",
    "tokio",
] }
http = "1"
http-body-util = "0.1"
bytes = "1"
mime = "0.3"

# Infraestrutura
redis = { version = "1", features = [
    "tokio-comp",
    "connection-manager",
    "script",
] }
moka = { version = "0.12", features = ["future"] }

# Serialização / configuração
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# Observabilidade
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Erros
thiserror = "2"

# Utilitários
async-trait = "0.1"
anyhow = "1"

# Desenvolvimento
criterion = "0.8"
# Redis efêmero para os testes de integração do rate limiter.
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["redis"] }
# Só para os testes de integração: cliente HTTP completo com redirects e pool.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
lto = "thin"
codegen-units = 1