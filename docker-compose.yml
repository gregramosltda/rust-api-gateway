# =============================================================================
# Sushi Tech Gateway — ambiente completo.
#
# Dois serviços, e o segundo é o único que não poderia ser embutido: o Redis
# guarda o orçamento de requisições de forma compartilhada. O restaurante
# simulado mora dentro do binário do gateway (rotas `/mock/*`), então não há um
# terceiro contêiner para subir antes de ver qualquer coisa.
#
#   docker compose up --build
#   abra http://127.0.0.1:8080
# =============================================================================

name: sushi-tech-gateway

services:
  redis:
    image: redis:7-alpine
    # O gateway conecta no startup; sem healthcheck, o `depends_on` não espera e
    # o gateway morre antes de o Redis aceitar conexão.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10
    # Sem volume: orçamento de requisições é estado de runtime. Persistir faria
    # um gateway reiniciado continuar barrando clientes que já cumpriram a
    # janela — o limite sobreviveria ao motivo que o justificava.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [gateway-net]

  gateway:
    build:
      context: .
      target: runtime
    depends_on:
      redis:
        condition: service_healthy
    ports:
      # Ligado a 127.0.0.1: sem autenticação, um gateway exposto na rede é um
      # proxy aberto para qualquer um que alcance a máquina.
      - "127.0.0.1:8080:8080"
    environment:
      RUST_LOG: "gateway=info,gateway_common=info"
      GATEWAY_LOG_FORMAT: "json"
    volumes:
      # Config do compose: o Redis é um nome de serviço da rede do Docker, não
      # localhost. A config da imagem aponta para um Redis em 127.0.0.1, que
      # dentro do contêiner não existe.
      - ./config/gateway.docker.toml:/app/config/gateway.toml:ro
    networks: [gateway-net]

networks:
  gateway-net:
    driver: bridge
